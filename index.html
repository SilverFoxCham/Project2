<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <section class="landing-card">
        <p class="eyebrow">Classic two-player</p>
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">
          Challenge a friend. Take turns placing X and O — first to three in a
          row wins.
        </p>
        <div class="landing-preview" aria-hidden="true">
          <span class="cell x">X</span>
          <span class="cell o">O</span>
          <span class="cell"></span>
          <span class="cell"></span>
          <span class="cell x">X</span>
          <span class="cell"></span>
          <span class="cell o">O</span>
          <span class="cell"></span>
          <span class="cell x">X</span>
        </div>
        <a class="play-button" href="game.html">Play game</a>
      </section>
    </main>
  </body>
</html>
