<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <section class="landing-card">
        <p class="eyebrow">Classic two-player</p>
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">
          Challenge a friend. Take turns placing a cross and a circle — first
          to three in a row wins.
        </p>
        <div class="landing-preview" aria-hidden="true">
          <span class="cell x"><svg class="glyph" viewBox="0 0 64 64"><path d="M18 18 L46 46 M46 18 L18 46" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></span>
          <span class="cell o"><svg class="glyph" viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="8"/></svg></span>
          <span class="cell"></span>
          <span class="cell"></span>
          <span class="cell x"><svg class="glyph" viewBox="0 0 64 64"><path d="M18 18 L46 46 M46 18 L18 46" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></span>
          <span class="cell"></span>
          <span class="cell o"><svg class="glyph" viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="8"/></svg></span>
          <span class="cell"></span>
          <span class="cell x"><svg class="glyph" viewBox="0 0 64 64"><path d="M18 18 L46 46 M46 18 L18 46" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></span>
        </div>
        <a class="play-button" href="game.html">Play game</a>
      </section>
    </main>
  </body>
</html>
