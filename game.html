<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">Two player</p>
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Take turns. First to three in a row wins.</p>
      </header>

      <section class="scoreboard" aria-label="Scoreboard">
        <article class="score-card" data-player="X">
          <span class="mark" aria-hidden="true"><svg class="glyph" viewBox="0 0 64 64"><path d="M18 18 L46 46 M46 18 L18 46" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></span>
          <span class="label">Player X</span>
          <strong id="score-x">0</strong>
        </article>
        <article class="score-card draws">
          <span class="mark">—</span>
          <span class="label">Draws</span>
          <strong id="score-draw">0</strong>
        </article>
        <article class="score-card" data-player="O">
          <span class="mark" aria-hidden="true"><svg class="glyph" viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="8"/></svg></span>
          <span class="label">Player O</span>
          <strong id="score-o">0</strong>
        </article>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">
        Player X starts
      </p>

      <div
        id="board"
        class="board"
        role="grid"
        aria-label="Tic tac toe board"
      ></div>

      <div class="actions">
        <button id="new-round" type="button">New round</button>
        <button id="reset-scores" type="button" class="ghost">Reset scores</button>
      </div>

      <p class="back-wrap">
        <a class="back-link" href="index.html">Back to home</a>
      </p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
